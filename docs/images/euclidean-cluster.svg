<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <rect width="920" height="500" fill="#ffffff"/>

  <text x="460" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">欧氏聚类：谁跟谁"够得着"，就归成一堆</text>

  <!-- ============ 左：两簇 ============ -->
  <text x="250" y="66" text-anchor="middle" font-size="16" font-weight="600" fill="#475569">① 两个物体离得远 → 分成两簇</text>

  <!-- 团内连线 -->
  <g stroke="#93c5fd" stroke-width="2">
    <line x1="160" y1="170" x2="190" y2="165"/><line x1="190" y1="165" x2="185" y2="205"/>
    <line x1="160" y1="170" x2="150" y2="200"/><line x1="150" y1="200" x2="185" y2="205"/>
    <line x1="170" y1="185" x2="200" y2="190"/><line x1="185" y1="205" x2="200" y2="190"/>
    <line x1="340" y1="170" x2="370" y2="168"/><line x1="340" y1="170" x2="330" y2="200"/>
    <line x1="330" y1="200" x2="365" y2="205"/><line x1="365" y1="205" x2="370" y2="168"/>
    <line x1="350" y1="183" x2="380" y2="195"/><line x1="365" y1="205" x2="380" y2="195"/>
  </g>

  <!-- 团 A 的点 -->
  <g fill="#2563eb">
    <circle cx="160" cy="170" r="6"/><circle cx="190" cy="165" r="6"/><circle cx="150" cy="200" r="6"/>
    <circle cx="185" cy="205" r="6"/><circle cx="170" cy="185" r="6"/><circle cx="200" cy="190" r="6"/>
  </g>
  <!-- 团 B 的点 -->
  <g fill="#16a34a">
    <circle cx="340" cy="170" r="6"/><circle cx="370" cy="168" r="6"/><circle cx="330" cy="200" r="6"/>
    <circle cx="365" cy="205" r="6"/><circle cx="350" cy="183" r="6"/><circle cx="380" cy="195" r="6"/>
  </g>

  <!-- 团间距离标注 -->
  <line x1="205" y1="185" x2="325" y2="185" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="205,185 217,180 217,190" fill="#dc2626"/>
  <polygon points="325,185 313,180 313,190" fill="#dc2626"/>
  <text x="265" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">间距 8.0 mm</text>
  <text x="265" y="150" text-anchor="middle" font-size="13" fill="#dc2626">大于容差 3.0 mm</text>
  <text x="265" y="176" text-anchor="middle" font-size="12" fill="#991b1b">→ 断开了</text>

  <text x="250" y="240" text-anchor="middle" font-size="13" fill="#64748b">团内点间距约 1.0 mm（小于容差，互相连得上）</text>

  <rect x="120" y="258" width="260" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="250" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">结果：2 个簇（蓝色团、绿色团）</text>

  <!-- 分隔竖线 -->
  <line x1="460" y1="60" x2="460" y2="320" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ============ 右：临界 ============ -->
  <text x="690" y="66" text-anchor="middle" font-size="16" font-weight="600" fill="#475569">② 容差卡在临界值 → 簇会碎掉</text>

  <!-- 正交连线（绿） -->
  <g stroke="#16a34a" stroke-width="2.5">
    <line x1="560" y1="150" x2="605" y2="150"/><line x1="605" y1="150" x2="650" y2="150"/>
    <line x1="560" y1="195" x2="605" y2="195"/><line x1="605" y1="195" x2="650" y2="195"/>
    <line x1="560" y1="240" x2="605" y2="240"/><line x1="605" y1="240" x2="650" y2="240"/>
    <line x1="560" y1="150" x2="560" y2="195"/><line x1="560" y1="195" x2="560" y2="240"/>
    <line x1="605" y1="150" x2="605" y2="195"/><line x1="605" y1="195" x2="605" y2="240"/>
    <line x1="650" y1="150" x2="650" y2="195"/><line x1="650" y1="195" x2="650" y2="240"/>
  </g>

  <!-- 斜对角（红虚线，表示"差一点就连不上"） -->
  <line x1="560" y1="150" x2="605" y2="195" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="505" y="160" font-size="12" font-weight="700" fill="#dc2626">1.99 mm</text>

  <!-- 点阵 -->
  <g fill="#7c3aed">
    <circle cx="560" cy="150" r="6"/><circle cx="605" cy="150" r="6"/><circle cx="650" cy="150" r="6"/>
    <circle cx="560" cy="195" r="6"/><circle cx="605" cy="195" r="6"/><circle cx="650" cy="195" r="6"/>
    <circle cx="560" cy="240" r="6"/><circle cx="605" cy="240" r="6"/><circle cx="650" cy="240" r="6"/>
  </g>

  <!-- 间距标注 -->
  <text x="700" y="147" font-size="12" fill="#166534">← 横向 1.31 mm</text>
  <text x="700" y="197" font-size="12" fill="#166534">← 纵向 1.50 mm</text>

  <rect x="510" y="266" width="360" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="690" y="290" text-anchor="middle" font-size="13" fill="#b91c1c">容差 2.0 mm → 斜对角刚好断开 → 实测碎成 20 个簇</text>

  <rect x="510" y="306" width="360" height="36" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="690" y="330" text-anchor="middle" font-size="13" fill="#15803d">容差 3.0 mm → 斜对角也连上 → 实测整片连通</text>

  <!-- ============ 底部真实数据 ============ -->
  <line x1="40" y1="360" x2="880" y2="360" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="460" y="390" text-anchor="middle" font-size="15" fill="#1e293b">本项目真实数据（管道周向间距 1.31 mm、轴向 1.5 mm、斜对角 1.99 mm、噪声 ±0.05 mm）</text>

  <text x="460" y="424" text-anchor="middle" font-size="16">
    <tspan font-weight="700" fill="#16a34a">容差 3.0 mm：2 个簇</tspan>
    <tspan fill="#94a3b8">   ｜   </tspan>
    <tspan font-weight="700" fill="#dc2626">容差 2.0 mm：20 个簇</tspan>
    <tspan fill="#94a3b8">   ｜   </tspan>
    <tspan font-weight="700" fill="#7c3aed">容差 1.0 mm：0 个簇</tspan>
  </text>
  <text x="460" y="454" text-anchor="middle" font-size="13" fill="#64748b">容差小了碎、容差大了粘在一起 —— 它没有"标准答案"，要对准你数据里的真实点间距</text>
</svg>
